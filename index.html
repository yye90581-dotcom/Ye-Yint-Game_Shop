<div class="row">
  <label>💳 Payment Method</label>
  <select id="paymentMethod" required>
    <option value="">ငွေပေးချေမှုနည်းလမ်း ရွေးပါ</option>
    <option value="KPay">KPay</option>
    <option value="WavePay">WavePay</option>
    <option value="KBZPay">KBZPay</option>
  </select>
</div>

<div class="row">
  <label>🧾 ငွေလွှဲပြေစာ / Payment Slip</label>
  <input
    id="paymentSlip"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    required
  >
  <small>ငွေလွှဲပြီးသား Screenshot / Photo တင်ပါ</small>
</div><script>
async function submitOrder(e){
  e.preventDefault();

  const form = e.target;
  const btn = form.querySelector('button[type="submit"]');
  const slip = document.getElementById('paymentSlip').files[0];

  if(!slip){
    toast('❌ ငွေလွှဲပြေစာ တင်ပေးပါ');
    return;
  }

  if(slip.size > 5 * 1024 * 1024){
    toast('❌ Slip ပုံ 5MB ထက်မကျော်ရပါ');
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ SENDING...';

  const fd = new FormData();

  fd.append('game', document.getElementById('game').value);
  fd.append('package', document.getElementById('package').value);
  fd.append('playerId', document.getElementById('playerId').value.trim());
  fd.append('serverId', document.getElementById('serverId').value.trim());
  fd.append('phone', document.getElementById('phone').value.trim());
  fd.append('quantity', document.getElementById('qty').value);
  fd.append('paymentMethod', document.getElementById('paymentMethod').value);
  fd.append('paymentSlip', slip);

  try {
    const r = await fetch('/api/order', {
      method: 'POST',
      body: fd
    });

    const j = await r.json().catch(() => ({}));

    if(!r.ok || !j.ok){
      throw new Error(j.error || 'Order ပို့မရပါ');
    }

    toast('✅ Order + Payment Slip Telegram သို့ ပို့ပြီးပါပြီ');

    form.reset();
    document.getElementById('qty').value = 1;
    updateTotal();

  } catch(err) {
    toast('❌ ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '✈ CONFIRM ORDER';
  }
}
</script>
